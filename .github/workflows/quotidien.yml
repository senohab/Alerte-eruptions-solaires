name: Surveillance solaire

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "30 3 * * *"
    workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python surveiller.py
      - name: Enregistrer le résultat
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add alerte.json
          git commit -m "Mise à jour alerte" || exit 0
          git push
